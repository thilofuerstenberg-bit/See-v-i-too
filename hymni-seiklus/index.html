<!doctype html><html lang="et"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hümni seiklus 🇪🇪</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#edf7fc;color:#16324a}header{background:linear-gradient(#489ed0 0 33%,#17232e 33% 66%,white 66%);padding:30px 10px;text-align:center}h1{display:inline-block;background:white;padding:12px 24px;border-radius:22px}main{max-width:800px;margin:auto;padding:20px}.panel{background:white;padding:24px;border-radius:24px;box-shadow:0 8px 25px #17445a18;margin-top:20px}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}button{border:0;border-radius:16px;padding:17px;font:700 19px system-ui;background:#dceffb;color:#17354b;cursor:pointer;min-height:60px}.primary{background:#1987c4;color:white}.success{background:#d9f4df}.center{text-align:center}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.line{font-size:clamp(23px,4vw,31px);text-align:center;font-weight:650;line-height:1.6}.word{border:2px solid #a8d5ef;border-radius:13px;background:#e9f4fc;margin:5px;padding:12px;font-size:20px;min-height:0}.selected{background:#b7e8c7}.hint{color:#526b7a}.feedback{min-height:45px;text-align:center;font-size:22px;font-weight:bold}.progress{height:13px;background:#e2edf4;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#47ad77}.footer{text-align:center;color:#55707f;font-size:14px}@media(max-width:480px){.menu{grid-template-columns:1fr}}</style>
<header><h1>🇪🇪 Hümni seiklus</h1></header><main><p class="center">Õpime Eesti hümni sõnu mängides! 🌟</p><div id="app"></div><p class="footer">„Mu isamaa, mu õnn ja rõõm” · 1. salm</p></main><script>
const lines=['Mu isamaa, mu õnn ja rõõm,','kui kaunis oled sa!','Ei leia mina iial teal','see suure, laia ilma peal,','mis mul nii armas oleks ka,','kui sa, mu isamaa!'];
const quiz=[['Mu isamaa, mu ___ ja rõõm,','õnn',['õnn','laul','kodu']],['kui ___ oled sa!','kaunis',['kallis','kaunis','väike']],['Ei leia mina ___ teal','iial',['alati','iial','täna']],['see suure, laia ___ peal,','ilma',['mere','ilma','metsa']],['mis mul nii ___ oleks ka,','armas',['ilus','armas','suur']],['kui sa, mu ___!','isamaa',['isamaa','sõber','kodumaa']]];
let stars=Number(localStorage.getItem('hymnStars')||0),mode='',idx=0,score=0,chosen=[],bank=[],locked=false;const app=document.getElementById('app');function btn(t,f,c=''){return '<button class="'+c+'" onclick="'+f+'">'+t+'</button>'}function shell(s){app.innerHTML=(mode?btn('← Avalehele','home()'):'')+'<section class="panel">'+s+'</section>'}function home(){mode='';shell('<div class="center"><h2>🏅 Minu tähed: '+stars+' ⭐</h2><p>Vali mäng ja alusta!</p></div><div class="menu">'+btn('📖 Õpi sõnu',"start('learn')",'primary')+btn('🧩 Sõnade pusle',"start('order')")+btn('🔎 Puuduv sõna',"start('missing')")+btn('🏆 Hümni väljakutse',"start('challenge')",'success')+'</div><p class="hint center">Tähed salvestatakse selles seadmes.</p>')}function start(m){mode=m;idx=0;score=0;locked=false;render()}function progress(){return '<div class="progress"><div style="width:'+idx/6*100+'%"></div></div><p class="center">'+(idx+1)+' / 6</p>'}
function render(){if(idx>=6){stars+=score;localStorage.setItem('hymnStars',stars);shell('<div class="center"><h2>🎉 Väga tubli!</h2><p>Sa said '+score+' tähte! ⭐</p><p>Kokku: '+stars+' ⭐</p>'+btn('Mängi uuesti',"start('"+mode+"')",'primary')+' '+btn('Avalehele','home()')+'</div>');return}if(mode==='learn'){shell(progress()+'<h2 class="center">📖 Õpi sõnu</h2><p class="line">'+lines[idx]+'</p><p class="center hint">Loe valjusti või laula! 🎵</p><div class="row">'+btn('🔊 Kuula','speak()')+btn('← Eelmine','previous()')+btn(idx===5?'Valmis! ⭐':'Järgmine →','nextLearn()','primary')+'</div>');return}if(mode==='missing'||mode==='challenge'&&idx%2===0){let q=quiz[idx];shell(progress()+'<h2 class="center">🔎 Puuduv sõna</h2><p class="line">'+q[0].replace('___','_____')+'</p><div class="menu">'+q[2].map((o,i)=>btn(o,'answer('+i+')')).join('')+'</div><p class="feedback" id="feedback" aria-live="polite"></p>');return}prepareOrder()}
function prepareOrder(){bank=lines[idx].split(/\s+/).map((w,i)=>({w,i}));for(let i=bank.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[bank[i],bank[j]]=[bank[j],bank[i]]}chosen=[];renderOrder()}function renderOrder(){shell(progress()+'<h2 class="center">🧩 Sõnade pusle</h2><p class="center hint">Puuduta sõnu õiges järjekorras.</p><div class="row" style="min-height:70px;background:#f6fafc;padding:10px">'+(chosen.map(x=>'<span class="word selected">'+x.w+'</span>').join('')||'Sinu lause ilmub siia…')+'</div><hr><div class="row">'+bank.map(x=>'<button class="word" onclick="pick('+x.i+')">'+x.w+'</button>').join('')+'</div><p class="feedback" id="feedback"></p><div class="row">'+btn('↩ Alusta uuesti','prepareOrder()')+btn('Kontrolli ✓','checkOrder()','primary')+'</div>')}function pick(i){if(locked)return;let k=bank.findIndex(x=>x.i===i);if(k<0)return;chosen.push(bank.splice(k,1)[0]);renderOrder()}function checkOrder(){if(locked)return;let ok=chosen.length===lines[idx].split(/\s+/).length&&chosen.every((x,i)=>x.i===i);if(ok){locked=true;score++;document.getElementById('feedback').textContent='Õige! ⭐';setTimeout(()=>{idx++;locked=false;render()},900)}else document.getElementById('feedback').textContent='Proovi veel! 💪'}function answer(i){if(locked)return;let q=quiz[idx];if(q[2][i]===q[1]){locked=true;score++;document.getElementById('feedback').textContent='Õige! ⭐';setTimeout(()=>{idx++;locked=false;render()},900)}else document.getElementById('feedback').textContent='Proovi uuesti! 🙂'}function nextLearn(){idx++;score++;render()}function previous(){idx=Math.max(0,idx-1);score=Math.max(0,score-1);render()}function speak(){if(!('speechSynthesis'in window)){alert('Ettelugemine ei ole saadaval.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lines[idx]);u.lang='et-EE';u.rate=.78;speechSynthesis.speak(u)}home();
</script></html>
